name: Repository checks

on:
  pull_request:
  push:
    branches: [dev, preview, main]

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:repo
